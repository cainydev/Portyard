services:
    # ---------- Traefik reverse proxy ----------
    traefik:
        container_name: portyard-traefik
        image: traefik:3.6.1
        ports:
            - "80:80"
            - "443:443"
            - "8080:8080"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
            - "./traefik:/etc/traefik" # Traefik config + TLS certs
            - "letsencrypt:/letsencrypt" # Let's Encrypt storage (prod)
        networks:
            - sail
        command:
            - "--configFile=/etc/traefik/traefik.dev.yml"
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.dashboard.rule=Host(`traefik.${APP_DOMAIN:-portyard.local}`)"
            - "traefik.http.routers.dashboard.service=api@internal"
            - "traefik.http.routers.dashboard.entrypoints=websecure"
            - "traefik.http.routers.dashboard.tls=true"

    # ---------- Laravel web ui ----------
    laravel:
        container_name: portyard-laravel
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            XDG_CONFIG_HOME: "/var/www/html/config"
            XDG_DATA_HOME: "/var/www/html/data"
            APP_URL: '${APP_URL}'
        ports:
            - "5173:5173"
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mariadb
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.laravel.rule=Host(`${APP_DOMAIN:-portyard.local}`)"
            - "traefik.http.routers.laravel.entrypoints=websecure"
            - "traefik.http.routers.laravel.tls=true"
            - "traefik.http.routers.laravel.service=laravel-web"
            - "traefik.http.routers.laravel.priority=10"
            - "traefik.http.services.laravel-web.loadbalancer.server.port=80"

    # ---------- MariaDB database ----------
    mariadb:
        container_name: portyard-mariadb
        image: 'mariadb:11.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MARIADB_ROOT_PASSWORD: '${DB_PASSWORD}'
            MARIADB_ROOT_HOST: '%'
            MARIADB_DATABASE: '${DB_DATABASE}'
            MARIADB_USER: '${DB_USERNAME}'
            MARIADB_PASSWORD: '${DB_PASSWORD}'
            MARIADB_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - 'portyard-mariadb:/var/lib/mysql'
            - './vendor/laravel/sail/database/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
            interval: 10s
            timeout: 5s
            retries: 3

    # ---------- Valkey storage ----------
    valkey:
        container_name: portyard-valkey
        image: 'valkey/valkey:alpine'
        ports:
            - '${FORWARD_VALKEY_PORT:-6379}:6379'
        volumes:
            - 'portyard-valkey:/data'
        networks:
            - sail
        healthcheck:
            test: 'CMD valkey-cli ping'
            retries: 3
            timeout: 5s

    # ---------- CNCF Container registry ----------
    registry:
        container_name: portyard-registry
        image: registry:2
        ports:
            - "5000:5000"
            - "5001:5001"
        environment:
            # Enable Token Auth
            REGISTRY_AUTH: token

            # Who issued the token? (Matches DOCKHAND_AUTHORITY_NAME)
            REGISTRY_AUTH_TOKEN_ISSUER: '${DOCKHAND_AUTHORITY_NAME}'

            # What service is this? (Matches DOCKHAND_REGISTRY_NAME)
            REGISTRY_AUTH_TOKEN_SERVICE: '${DOCKHAND_REGISTRY_NAME}'

            # Where do users login?
            REGISTRY_AUTH_TOKEN_REALM: 'https://${APP_DOMAIN:-portyard.local}/auth/token'

            # Internal Certificate Path (Where we mount it inside the container)
            REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /etc/docker/registry/auth.pem

            # Notifications Endpoint URL
            REGISTRY_NOTIFICATIONS_ENDPOINTS_0_URL: 'https://${APP_DOMAIN:-portyard.local}${DOCKHAND_NOTIFICATIONS_ROUTE}'

            # Notifications Authorization Header
            REGISTRY_NOTIFICATIONS_ENDPOINTS_0_HEADERS_Authorization: 'Bearer ${DOCKHAND_NOTIFICATIONS_TOKEN}'

            # Notifications Config
            REGISTRY_NOTIFICATIONS_ENDPOINTS_0_TIMEOUT: 500ms
            REGISTRY_NOTIFICATIONS_ENDPOINTS_0_THRESHOLD: 5
            REGISTRY_NOTIFICATIONS_ENDPOINTS_0_BACKOFF: 1s

            # Reuse APP_KEY for the registry's internal cookie secret
            REGISTRY_HTTP_SECRET: '${APP_KEY}'

        networks:
            - sail
        volumes:
            - portyard-registry:/var/lib/registry
            - ./registry.yml:/etc/docker/registry/config.yml
            # Mount the Public Key
            - ./certs/public/ca.pem:/etc/docker/registry/auth.pem:ro
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.registry.rule=Host(`${APP_DOMAIN:-portyard.local}`) && PathPrefix(`/v2/`)"
            - "traefik.http.routers.registry.entrypoints=websecure"
            - "traefik.http.routers.registry.tls=true"
            - "traefik.http.services.registry.loadbalancer.server.port=5000"

networks:
    sail:
        driver: bridge

volumes:
    portyard-mariadb:
        driver: local
    portyard-valkey:
        driver: local
    portyard-registry:
        driver: local
    letsencrypt:
        driver: local
